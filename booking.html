<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TERMINO | Rezervacija</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#0b0b0b;
color:#fff;
font-family:Arial,sans-serif;
padding:20px;
}

.wrap{
max-width:680px;
margin:20px auto;
}

.logo{
color:#d8ad55;
font-size:40px;
font-weight:900;
}

.card{
background:#151515;
border:1px solid #333;
border-radius:20px;
padding:20px;
margin:16px 0;
}

label{
display:block;
margin:13px 0 7px;
font-weight:800;
}

input,
select,
textarea{
width:100%;
padding:14px;
border-radius:11px;
border:1px solid #444;
background:#222;
color:#fff;
font-size:16px;
}

textarea{
min-height:90px;
}

button{
width:100%;
padding:16px;
border:0;
border-radius:13px;
background:#d8ad55;
color:#111;
font-weight:900;
font-size:17px;
margin-top:18px;
}

button:disabled{
opacity:.55;
}

#msg{
margin-top:15px;
font-weight:800;
text-align:center;
line-height:1.5;
}

.muted{
color:#aaa;
}
</style>
</head>

<body>

<div class="wrap">

<div class="logo">TERMINO</div>

<h1>Rezerviši termin</h1>

<p class="muted">
Prikazujemo samo termine koje je salon označio zeleno.
</p>

<div class="card">

<label>Salon</label>

<select id="salon">
<option value="">-- Odaberi salon --</option>
</select>


<label>Usluga</label>

<select id="service" disabled>
<option value="">-- Odaberi salon --</option>
</select>


<label>Datum</label>

<input id="date" type="date">


<label>Slobodno vrijeme</label>

<select id="time" disabled>
<option value="">-- Odaberi datum i uslugu --</option>
</select>

</div>


<div class="card">

<label>Ime i prezime</label>

<input
id="name"
type="text"
placeholder="Ime i prezime"
>


<label>Telefon</label>

<input
id="phone"
type="tel"
placeholder="Broj telefona"
>


<label>Email</label>

<input
id="email"
type="email"
placeholder="Email adresa"
>


<label>Napomena</label>

<textarea
id="note"
placeholder="Nije obavezno"
></textarea>


<button id="book">
REZERVIŠI TERMIN
</button>


<div id="msg"></div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://ykkopljgzdcnfbyutxzo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_g0DyVw3GMFgrjZHwSeuvkQ_6x54CKue";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const $ =
id => document.getElementById(id);


const params =
new URLSearchParams(
location.search
);

const preselectedSalon =
params.get("salon");


let serviceMap = {};


const today =
new Date();

$("date").min =
today
.toISOString()
.slice(0,10);


async function loadSalons(){

const {
data,
error
} =
await db
.from("salons")
.select("id,name")
.order("name");


if(error){

$("msg").textContent =
"Greška pri učitavanju salona.";

return;

}


(data || [])
.forEach(s => {

const option =
document.createElement("option");

option.value =
s.id;

option.textContent =
s.name || "Salon";

$("salon")
.appendChild(option);

});


if(preselectedSalon){

$("salon").value =
preselectedSalon;

await loadServices();

}

}


async function loadServices(){

const salonId =
$("salon").value;


$("service").innerHTML =
'<option value="">-- Odaberi uslugu --</option>';


$("service").disabled =
!salonId;


serviceMap = {};


if(!salonId)
return;


const {
data,
error
} =
await db
.from("services")
.select(
"id,name,category,price,duration_minutes"
)
.eq(
"salon_id",
salonId
)
.order("category")
.order("name");


if(error){

$("msg").textContent =
"Greška pri učitavanju usluga.";

return;

}


(data || [])
.forEach(s => {

serviceMap[s.id] = s;


const option =
document.createElement("option");


option.value =
s.id;


option.textContent =
`${s.category || ""}
—
${s.name}
—
${s.price} €
—
${s.duration_minutes} min`;


$("service")
.appendChild(option);

});


await loadTimes();

}


async function loadTimes(){

const salonId =
$("salon").value;

const serviceId =
$("service").value;

const date =
$("date").value;


$("time").innerHTML =
'<option value="">-- Odaberi vrijeme --</option>';


$("time").disabled = true;


if(
!salonId ||
!serviceId ||
!date
)
return;


const service =
serviceMap[serviceId];


if(!service)
return;


const {
data:slots,
error:slotError
} =
await db
.from("availability_slots")
.select("slot_time")
.eq(
"salon_id",
salonId
)
.eq(
"slot_date",
date
)
.eq(
"is_available",
true
)
.order("slot_time");


if(slotError){

$("msg").textContent =
"Greška pri učitavanju termina.";

return;

}


const {
data:bookings
} =
await db
.from("bookings")
.select(`
booking_time,
service_id,
status,
services(
duration_minutes
)
`)
.eq(
"salon_id",
salonId
)
.eq(
"booking_date",
date
);


const green =
new Set(
(slots || [])
.map(
x =>
String(
x.slot_time
)
.slice(0,5)
)
);


const required =
Math.ceil(
service.duration_minutes / 15
);


function toMinutes(time){

const parts =
time
.split(":")
.map(Number);

return
parts[0] * 60
+
parts[1];

}


function formatTime(minutes){

return
String(
Math.floor(minutes / 60)
)
.padStart(2,"0")
+
":"
+
String(minutes % 60)
.padStart(2,"0");

}


function overlaps(
start,
duration
){

const end =
start + duration;


return
(bookings || [])
.some(b => {

const status =
(
b.status || ""
)
.toLowerCase();


if(
status === "cancelled" ||
status === "canceled"
)
return false;


const bookingStart =
toMinutes(
String(
b.booking_time
)
.slice(0,5)
);


const bookingDuration =
b.services?.duration_minutes
||
0;


const bookingEnd =
bookingStart
+
bookingDuration;


return
bookingStart < end
&&
bookingEnd > start;

});

}


const starts =
[...green]
.sort();


starts.forEach(time => {

const start =
toMinutes(time);


let available = true;


for(
let i = 0;
i < required;
i++
){

const neededTime =
formatTime(
start + i * 15
);


if(
!green.has(
neededTime
)
){

available = false;

break;

}

}


if(
available &&
!overlaps(
start,
service.duration_minutes
)
){

const option =
document.createElement("option");

option.value =
time;

option.textContent =
time;

$("time")
.appendChild(option);

}

});


$("time").disabled =
false;

}


$("salon")
.addEventListener(
"change",
async () => {

await loadServices();

}
);


$("service")
.addEventListener(
"change",
loadTimes
);


$("date")
.addEventListener(
"change",
loadTimes
);


$("book")
.addEventListener(
"click",
async () => {


const salonId =
$("salon").value;

const serviceId =
$("service").value;

const customerName =
$("name").value.trim();

const customerPhone =
$("phone").value.trim();

const customerEmail =
$("email").value.trim();

const bookingDate =
$("date").value;

const bookingTime =
$("time").value;

const note =
$("note").value.trim();


if(
!salonId ||
!serviceId ||
!customerName ||
!customerPhone ||
!customerEmail ||
!bookingDate ||
!bookingTime
){

$("msg").style.color =
"#ff7373";

$("msg").textContent =
"Popuni sva obavezna polja.";

return;

}


$("book").disabled = true;

$("book").textContent =
"PROVJERA...";


const {
error
} =
await db.rpc(
"create_booking_if_available",
{

p_salon_id:
salonId,

p_service_id:
serviceId,

p_customer_name:
customerName,

p_customer_email:
customerEmail,

p_customer_phone:
customerPhone,

p_booking_date:
bookingDate,

p_booking_time:
bookingTime,

p_note:
note || null

}
);


$("book").disabled = false;

$("book").textContent =
"REZERVIŠI TERMIN";


if(error){

$("msg").style.color =
"#ff7373";

$("msg").textContent =
"⛔ "
+
error.message;

await loadTimes();

return;

}


$("msg").style.color =
"#7ee787";

$("msg").textContent =
"✅ Termin je uspješno rezervisan.";


$("name").value = "";

$("phone").value = "";

$("email").value = "";

$("note").value = "";


await loadTimes();

});


loadSalons();

</script>

</body>
</html>
