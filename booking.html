<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TERMINO | Rezervacija</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#0b0b0b;
color:#fff;
font-family:Arial,sans-serif;
padding:20px;
}

.wrap{
max-width:720px;
margin:20px auto;
}

.logo{
color:#d8ad55;
font-size:40px;
font-weight:900;
}

.card{
background:#151515;
border:1px solid #333;
border-radius:20px;
padding:20px;
margin:16px 0;
}

label{
display:block;
margin:13px 0 7px;
font-weight:800;
}

input,
select,
textarea{
width:100%;
padding:14px;
border-radius:11px;
border:1px solid #444;
background:#222;
color:#fff;
font-size:16px;
}

textarea{
min-height:90px;
}

button{
border:0;
border-radius:12px;
padding:14px;
font-weight:900;
cursor:pointer;
}

#book{
width:100%;
background:#d8ad55;
color:#111;
font-size:17px;
margin-top:18px;
}

#book:disabled{
opacity:.5;
}

.muted{
color:#aaa;
}

#timeGrid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:9px;
margin-top:12px;
}

.timeBtn{
padding:12px 6px;
text-align:center;
}

.free{
background:#163d24;
color:#8cffaa;
border:1px solid #2d7a45;
}

.busy{
background:#441d1d;
color:#ff9c9c;
border:1px solid #7e3333;
opacity:.85;
}

.selected{
outline:3px solid #d8ad55;
}

#msg{
margin-top:15px;
font-weight:800;
text-align:center;
line-height:1.5;
}

.cancelBox{
margin-top:18px;
padding:14px;
border-radius:12px;
background:#222;
border:1px solid #444;
}

.cancelBox a{
color:#d8ad55;
font-weight:800;
}

@media(max-width:600px){

#timeGrid{
grid-template-columns:repeat(3,1fr);
}

}
</style>
</head>

<body>

<div class="wrap">

<div class="logo">
TERMINO
</div>

<h1>
Rezerviši termin
</h1>

<p class="muted">
🟢 slobodno · 🔴 zauzeto
</p>


<div class="card">

<label>
Salon
</label>

<select id="salon">
<option value="">
-- Odaberi salon --
</option>
</select>


<label>
Usluga
</label>

<select id="service" disabled>
<option value="">
-- Odaberi salon --
</option>
</select>


<label>
Datum
</label>

<input id="date" type="date">


<label>
Termini
</label>

<div id="timeGrid">

<div class="muted">
Odaberi salon, uslugu i datum.
</div>

</div>

<input
id="selectedTime"
type="hidden"
>

</div>


<div class="card">

<label>
Ime i prezime
</label>

<input
id="name"
type="text"
placeholder="Ime i prezime"
>


<label>
Telefon
</label>

<input
id="phone"
type="tel"
placeholder="Broj telefona"
>


<label>
Email
</label>

<input
id="email"
type="email"
placeholder="Email adresa"
>


<label>
Napomena
</label>

<textarea
id="note"
placeholder="Nije obavezno"
></textarea>


<button id="book">
REZERVIŠI TERMIN
</button>


<div id="msg"></div>

<div id="cancelInfo"></div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const db =
supabase.createClient(
"https://ykkopljgzdcnfbyutxzo.supabase.co",
"sb_publishable_g0DyVw3GMFgrjZHwSeuvkQ_6x54CKue"
);

const $ =
id =>
document.getElementById(id);


const preselectedSalon =
new URLSearchParams(
location.search
).get("salon");


let serviceMap = {};


$("date").min =
new Date()
.toISOString()
.slice(0,10);


function toMinutes(time){

const [h,m] =
time
.split(":")
.map(Number);

return
h * 60
+
m;

}


function sleep(ms){

return new Promise(
resolve =>
setTimeout(resolve,ms)
);

}


async function loadSalons(){

const {
data,
error
} =
await db
.from("salons")
.select("id,name")
.order("name");


if(error){

$("msg").style.color =
"#ff7373";

$("msg").textContent =
"Greška pri učitavanju salona.";

return;

}


(data || [])
.forEach(salon=>{

const option =
document.createElement("option");

option.value =
salon.id;

option.textContent =
salon.name || "Salon";

$("salon")
.appendChild(option);

});


if(preselectedSalon){

$("salon").value =
preselectedSalon;

await loadServices();

}

}


async function loadServices(){

const salonId =
$("salon").value;


$("service").innerHTML =
'<option value="">-- Odaberi uslugu --</option>';


$("service").disabled =
!salonId;


serviceMap = {};


if(!salonId){

$("timeGrid").innerHTML =
'<div class="muted">Odaberi salon, uslugu i datum.</div>';

return;

}


const {
data,
error
} =
await db
.from("services")
.select(
"id,name,category,price,duration_minutes"
)
.eq(
"salon_id",
salonId
)
.order("category")
.order("name");


if(error){

$("msg").style.color =
"#ff7373";

$("msg").textContent =
"Greška pri učitavanju usluga.";

return;

}


(data || [])
.forEach(service=>{

serviceMap[
service.id
] =
service;


const option =
document.createElement("option");


option.value =
service.id;


option.textContent =
`${service.category || ""}
— ${service.name}
— ${service.price} €
— ${service.duration_minutes} min`;


$("service")
.appendChild(option);

});


await loadTimes();

}


function renderTimes(items){

const grid =
$("timeGrid");


grid.innerHTML = "";

$("selectedTime").value = "";


items.forEach(item=>{

const button =
document.createElement("button");


button.type =
"button";


button.dataset.time =
item.time;


button.className =
"timeBtn "
+
(
item.free
?
"free"
:
"busy"
);


button.textContent =
(
item.free
?
"🟢 "
:
"🔴 "
)
+
item.time;


button.disabled =
!item.free;


if(item.free){

button.onclick =
()=>{

document
.querySelectorAll(
".timeBtn"
)
.forEach(x=>
x.classList.remove(
"selected"
)
);


button.classList.add(
"selected"
);


$("selectedTime").value =
item.time;

};

}


grid.appendChild(
button
);

});

}


async function loadTimes(){

const salonId =
$("salon").value;

const serviceId =
$("service").value;

const date =
$("date").value;


if(
!salonId ||
!serviceId ||
!date
){

$("timeGrid").innerHTML =
'<div class="muted">Odaberi salon, uslugu i datum.</div>';

$("selectedTime").value = "";

return;

}


const service =
serviceMap[
serviceId
];


if(!service)
return;


const {
data:slots,
error:slotError
} =
await db
.from(
"availability_slots"
)
.select(
"slot_time,is_available"
)
.eq(
"salon_id",
salonId
)
.eq(
"slot_date",
date
);


if(slotError){

$("msg").style.color =
"#ff7373";

$("msg").textContent =
"Greška pri učitavanju dostupnosti.";

return;

}


const {
data:busyBookings,
error:busyError
} =
await db.rpc(
"get_busy_bookings",
{

p_salon_id:
salonId,

p_booking_date:
date

}
);


if(busyError){

$("msg").style.color =
"#ff7373";

$("msg").textContent =
"Greška pri provjeri zauzetih termina.";

return;

}


const availability = {};


(slots || [])
.forEach(slot=>{

availability[
String(
slot.slot_time
)
.slice(0,5)
] =
slot.is_available === true;

});


function overlapsBooking(
start,
duration
){

const end =
start + duration;


return
(busyBookings || [])
.some(booking=>{

const busyStart =
toMinutes(
String(
booking.booking_time
)
.slice(0,5)
);


const busyDuration =
booking.duration_minutes
||
0;


const busyEnd =
busyStart
+
busyDuration;


return
busyStart < end
&&
busyEnd > start;

});

}


const allTimes = [];


for(
let hour = 8;
hour <= 20;
hour++
){

for(
const minute
of
[0,15,30,45]
){

if(
hour === 20
&&
minute > 0
)
continue;


allTimes.push(

String(hour)
.padStart(2,"0")

+

":"

+

String(minute)
.padStart(2,"0")

);

}

}


const result =
allTimes.map(time=>{

const start =
toMinutes(time);


let free =
availability[
time
]
=== true;


if(
free
&&
overlapsBooking(
start,
service.duration_minutes
)
){

free = false;

}


return {
time,
free
};

});


renderTimes(
result
);

}


function makeReservedTimeRed(
bookingTime,
duration
){

const bookingStart =
toMinutes(
bookingTime
);


const bookingEnd =
bookingStart
+
duration;


document
.querySelectorAll(
".timeBtn"
)
.forEach(button=>{

const time =
button.dataset.time;


if(!time)
return;


const start =
toMinutes(time);


if(
start >= bookingStart
&&
start < bookingEnd
){

button.classList.remove(
"free",
"selected"
);


button.classList.add(
"busy"
);


button.textContent =
"🔴 "
+
time;


button.disabled =
true;

}

});


$("selectedTime").value =
"";

}


$("salon")
.addEventListener(
"change",
loadServices
);


$("service")
.addEventListener(
"change",
loadTimes
);


$("date")
.addEventListener(
"change",
loadTimes
);


$("book")
.addEventListener(
"click",
async()=>{


const salonId =
$("salon").value;

const serviceId =
$("service").value;

const bookingDate =
$("date").value;

const bookingTime =
$("selectedTime").value;

const customerName =
$("name").value.trim();

const customerPhone =
$("phone").value.trim();

const customerEmail =
$("email").value.trim();

const note =
$("note").value.trim();


if(
!salonId ||
!serviceId ||
!bookingDate ||
!bookingTime ||
!customerName ||
!customerPhone ||
!customerEmail
){

$("msg").style.color =
"#ff7373";

$("msg").textContent =
"Popuni podatke i izaberi zeleni termin.";

return;

}


const selectedService =
serviceMap[
serviceId
];


$("book").disabled =
true;


$("book").textContent =
"PROVJERA...";


const {
data,
error
} =
await db.rpc(
"create_booking_if_available",
{

p_salon_id:
salonId,

p_service_id:
serviceId,

p_customer_name:
customerName,

p_customer_email:
customerEmail,

p_customer_phone:
customerPhone,

p_booking_date:
bookingDate,

p_booking_time:
bookingTime,

p_note:
note || null

}
);


$("book").disabled =
false;


$("book").textContent =
"REZERVIŠI TERMIN";


if(error){

$("msg").style.color =
"#ff7373";


$("msg").textContent =
"⛔ "
+
error.message;


await loadTimes();


return;

}


$("msg").style.color =
"#7ee787";


$("msg").textContent =
"✅ Termin je uspješno rezervisan.";


/* ODMAH PRETVORI TERMIN U CRVENO */

makeReservedTimeRed(
bookingTime,
selectedService.duration_minutes
);


const token =
data?.cancel_token;


if(token){

const cancelUrl =
location.origin
+
location.pathname.replace(
"booking.html",
"cancel.html"
)
+
"?token="
+
encodeURIComponent(
token
);


$("cancelInfo").innerHTML =
`
<div class="cancelBox">

<strong>
Ako želiš otkazati termin:
</strong>

<br><br>

<a href="${cancelUrl}">
OTKAŽI MOJ TERMIN
</a>

</div>
`;

}


/* PONOVO UČITAJ IZ BAZE DA OSTANE CRVENO */

await sleep(300);

await loadTimes();

});


loadSalons();

</script>

</body>
</html>
