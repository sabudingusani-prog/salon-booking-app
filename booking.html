<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TERMINO | Rezervacija</title>

<style>
*{box-sizing:border-box}
body{
margin:0;background:#0b0b0b;color:#fff;
font-family:Arial,sans-serif;padding:20px
}
.wrap{max-width:720px;margin:20px auto}
.logo{color:#d8ad55;font-size:40px;font-weight:900}
.card{
background:#151515;border:1px solid #333;
border-radius:20px;padding:20px;margin:16px 0
}
label{display:block;margin:13px 0 7px;font-weight:800}
input,select,textarea{
width:100%;padding:14px;border-radius:11px;
border:1px solid #444;background:#222;color:#fff;font-size:16px
}
button{
border:0;border-radius:12px;padding:14px;
font-weight:900;cursor:pointer
}
#book{
width:100%;background:#d8ad55;color:#111;
font-size:17px;margin-top:18px
}
.muted{color:#aaa}
#timeGrid{
display:grid;grid-template-columns:repeat(4,1fr);
gap:9px;margin-top:12px
}
.timeBtn{padding:12px 6px;text-align:center}
.free{
background:#163d24;color:#8cffaa;
border:1px solid #2d7a45
}
.busy{
background:#441d1d;color:#ff9c9c;
border:1px solid #7e3333;opacity:.75
}
.selected{outline:3px solid #d8ad55}
#msg{
margin-top:15px;font-weight:800;
text-align:center;line-height:1.5
}
.cancelBox{
margin-top:18px;padding:14px;border-radius:12px;
background:#222;border:1px solid #444;word-break:break-all
}
.cancelBox a{color:#d8ad55}

@media(max-width:600px){
#timeGrid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<body>

<div class="wrap">

<div class="logo">TERMINO</div>

<h1>Rezerviši termin</h1>

<p class="muted">
🟢 slobodno · 🔴 zauzeto. Klikni samo zeleni termin.
</p>

<div class="card">

<label>Salon</label>
<select id="salon">
<option value="">-- Odaberi salon --</option>
</select>

<label>Usluga</label>
<select id="service" disabled>
<option value="">-- Odaberi salon --</option>
</select>

<label>Datum</label>
<input id="date" type="date">

<label>Termini</label>

<div id="timeGrid">
<div class="muted">
Odaberi salon, uslugu i datum.
</div>
</div>

<input id="selectedTime" type="hidden">

</div>

<div class="card">

<label>Ime i prezime</label>
<input id="name" type="text">

<label>Telefon</label>
<input id="phone" type="tel">

<label>Email</label>
<input id="email" type="email">

<label>Napomena</label>
<textarea id="note"></textarea>

<button id="book">
REZERVIŠI TERMIN
</button>

<div id="msg"></div>
<div id="cancelInfo"></div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const db = supabase.createClient(
"https://ykkopljgzdcnfbyutxzo.supabase.co",
"sb_publishable_g0DyVw3GMFgrjZHwSeuvkQ_6x54CKue"
);

const $ = id =>
document.getElementById(id);

const pre =
new URLSearchParams(location.search)
.get("salon");

let serviceMap = {};

$("date").min =
new Date()
.toISOString()
.slice(0,10);


function toMin(t){

const [h,m] =
t.split(":").map(Number);

return h*60+m;

}


function fmt(m){

return String(
Math.floor(m/60)
).padStart(2,"0")
+
":"
+
String(m%60)
.padStart(2,"0");

}


async function loadSalons(){

const {data,error} =
await db
.from("salons")
.select("id,name")
.order("name");

if(error){

$("msg").textContent =
"Greška pri učitavanju salona.";

return;

}

(data || []).forEach(s=>{

const o =
document.createElement("option");

o.value = s.id;

o.textContent =
s.name || "Salon";

$("salon").appendChild(o);

});

if(pre){

$("salon").value = pre;

await loadServices();

}

}


async function loadServices(){

const salon =
$("salon").value;

$("service").innerHTML =
'<option value="">-- Odaberi uslugu --</option>';

$("service").disabled =
!salon;

serviceMap = {};

if(!salon){

$("timeGrid").innerHTML =
'<div class="muted">Odaberi salon, uslugu i datum.</div>';

return;

}

const {data,error} =
await db
.from("services")
.select(
"id,name,category,price,duration_minutes"
)
.eq("salon_id",salon)
.order("category")
.order("name");

if(error){

$("msg").textContent =
"Greška pri učitavanju usluga.";

return;

}

(data || []).forEach(s=>{

serviceMap[s.id] = s;

const o =
document.createElement("option");

o.value = s.id;

o.textContent =
`${s.category || ""}
— ${s.name}
— ${s.price} €
— ${s.duration_minutes} min`;

$("service").appendChild(o);

});

await loadTimes();

}


function renderTimes(items){

const grid =
$("timeGrid");

grid.innerHTML = "";

$("selectedTime").value = "";

if(!items.length){

grid.innerHTML =
'<div class="muted">Nema termina za prikaz.</div>';

return;

}

items.forEach(item=>{

const b =
document.createElement("button");

b.type = "button";

b.className =
"timeBtn "
+
(item.free ? "free" : "busy");

b.textContent =
(item.free ? "🟢 " : "🔴 ")
+
item.time;

b.disabled =
!item.free;

if(item.free){

b.onclick = ()=>{

document
.querySelectorAll(".timeBtn")
.forEach(x=>
x.classList.remove("selected")
);

b.classList.add("selected");

$("selectedTime").value =
item.time;

};

}

grid.appendChild(b);

});

}


async function loadTimes(){

const salon =
$("salon").value;

const serviceId =
$("service").value;

const date =
$("date").value;

if(
!salon ||
!serviceId ||
!date
){

$("timeGrid").innerHTML =
'<div class="muted">Odaberi salon, uslugu i datum.</div>';

return;

}

const service =
serviceMap[serviceId];


const {
data:slots,
error:slotError
} =
await db
.from("availability_slots")
.select("slot_time,is_available")
.eq("salon_id",salon)
.eq("slot_date",date)
.order("slot_time");


if(slotError){

$("msg").textContent =
"Greška pri učitavanju termina.";

return;

}


const {
data:bookings
} =
await db
.from("bookings")
.select(`
booking_time,
status,
services(
duration_minutes
)
`)
.eq("salon_id",salon)
.eq("booking_date",date);


const map = {};

(slots || []).forEach(s=>{

map[
String(s.slot_time)
.slice(0,5)
] =
s.is_available === true;

});


const allTimes = [];

for(
let h=8;
h<=20;
h++
){

for(
const m of [0,15,30,45]
){

if(
h===20 &&
m>0
)
continue;

allTimes.push(
String(h).padStart(2,"0")
+
":"
+
String(m).padStart(2,"0")
);

}

}


function overlaps(
start,
duration
){

const end =
start + duration;

return (bookings || [])
.some(b=>{

const status =
(b.status || "")
.toLowerCase();

if(
status==="cancelled" ||
status==="canceled"
)
return false;

const bs =
toMin(
String(b.booking_time)
.slice(0,5)
);

const bd =
b.services?.duration_minutes
||
0;

return
bs < end
&&
(bs+bd) > start;

});

}


const required =
Math.ceil(
service.duration_minutes / 15
);


const result =
allTimes.map(t=>{

const start =
toMin(t);

let free = true;

for(
let i=0;
i<required;
i++
){

if(
map[
fmt(start+i*15)
]
!== true
){

free = false;

break;

}

}

if(
free &&
overlaps(
start,
service.duration_minutes
)
){

free = false;

}

return {
time:t,
free
};

});


renderTimes(result);

}


$("salon")
.addEventListener(
"change",
loadServices
);

$("service")
.addEventListener(
"change",
loadTimes
);

$("date")
.addEventListener(
"change",
loadTimes
);


$("book")
.addEventListener(
"click",
async()=>{

const salonId =
$("salon").value;

const serviceId =
$("service").value;

const bookingDate =
$("date").value;

const bookingTime =
$("selectedTime").value;

const customerName =
$("name").value.trim();

const customerPhone =
$("phone").value.trim();

const customerEmail =
$("email").value.trim();

const note =
$("note").value.trim();


if(
!salonId ||
!serviceId ||
!bookingDate ||
!bookingTime ||
!customerName ||
!customerPhone ||
!customerEmail
){

$("msg").style.color =
"#ff7373";

$("msg").textContent =
"Popuni sva polja i izaberi zeleni termin.";

return;

}


$("book").disabled = true;

$("book").textContent =
"PROVJERA...";


const {data,error} =
await db.rpc(
"create_booking_if_available",
{

p_salon_id:
salonId,

p_service_id:
serviceId,

p_customer_name:
customerName,

p_customer_email:
customerEmail,

p_customer_phone:
customerPhone,

p_booking_date:
bookingDate,

p_booking_time:
bookingTime,

p_note:
note || null

}
);


$("book").disabled = false;

$("book").textContent =
"REZERVIŠI TERMIN";


if(error){

$("msg").style.color =
"#ff7373";

$("msg").textContent =
"⛔ "
+
error.message;

await loadTimes();

return;

}


$("msg").style.color =
"#7ee787";

$("msg").textContent =
"✅ Termin je uspješno rezervisan.";


const token =
data?.cancel_token;


if(token){

const cancelUrl =
location.origin
+
location.pathname.replace(
"booking.html",
"cancel.html"
)
+
"?token="
+
encodeURIComponent(token);


$("cancelInfo").innerHTML =
`
<div class="cancelBox">

<strong>
Sačuvaj ovaj link ako želiš kasnije otkazati termin:
</strong>

<br><br>

<a href="${cancelUrl}">
OTKAŽI MOJ TERMIN
</a>

</div>
`;

}


await loadTimes();

});


loadSalons();

</script>

</body>
</html>
