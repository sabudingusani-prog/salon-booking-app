<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TERMINO | Rezervacija</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 20px auto;
    }

    .logo {
      color: #d8ad55;
      font-size: 38px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    h1 {
      font-size: 30px;
      margin: 0 0 8px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .card {
      background: #151515;
      border: 1px solid #333;
      border-radius: 22px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 16px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #444;
      border-radius: 12px;
      background: white;
      color: #111;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      margin-top: 22px;
      background: #d8ad55;
      color: #111;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
    }

    .info {
      color: #aaa;
      font-size: 14px;
      margin-top: 7px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">TERMINO</div>
  <h1>Rezerviši termin</h1>

  <div class="subtitle">
    Odaberi salon i uslugu, zatim upiši svoje podatke i željeni termin.
    Registracija nije potrebna.
  </div>

  <div class="card">

    <h2>📅 Rezervacija</h2>

    <label for="salon">Salon</label>
    <select id="salon">
      <option value="">-- Odaberi salon --</option>
    </select>

    <label for="service">Usluga</label>
    <select id="service" disabled>
      <option value="">-- Prvo odaberi salon --</option>
    </select>

    <label for="date">Datum</label>
    <input id="date" type="date">

    <label for="time">Vrijeme</label>
    <input id="time" type="time">

  </div>

  <div class="card">

    <h2>👤 Vaši podaci</h2>

    <label for="name">Ime i prezime</label>
    <input
      id="name"
      type="text"
      placeholder="Vaše ime i prezime"
      autocomplete="name"
    >

    <label for="phone">Broj telefona</label>
    <input
      id="phone"
      type="tel"
      placeholder="Broj telefona"
      autocomplete="tel"
    >

    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      placeholder="Email adresa"
      autocomplete="email"
    >

    <label for="note">Napomena (nije obavezno)</label>
    <textarea
      id="note"
      placeholder="Npr. dodatna napomena za salon"
    ></textarea>

    <button id="bookButton" type="button">
      REZERVIŠI TERMIN
    </button>

    <div id="message"></div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://ykkopljgzdcnfbyutxzo.supabase.co";
  const SUPABASE_KEY = "sb_publishable_g0DyVw3GMFgrjZHwSeuvkQ_6x54CKue";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const salonSelect = document.getElementById("salon");
  const serviceSelect = document.getElementById("service");
  const dateInput = document.getElementById("date");
  const timeInput = document.getElementById("time");

  const nameInput = document.getElementById("name");
  const phoneInput = document.getElementById("phone");
  const emailInput = document.getElementById("email");
  const noteInput = document.getElementById("note");

  const bookButton = document.getElementById("bookButton");
  const message = document.getElementById("message");

  let services = [];

  const today = new Date();
  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, "0");
  const day = String(today.getDate()).padStart(2, "0");

  dateInput.min = `${year}-${month}-${day}`;

  async function loadSalons() {

    message.textContent = "";

    const { data, error } = await supabaseClient
      .from("salons")
      .select("*");

    if (error) {
      console.error(error);
      message.style.color = "#ff7373";
      message.textContent = "Greška pri učitavanju salona.";
      return;
    }

    salonSelect.innerHTML =
      '<option value="">-- Odaberi salon --</option>';

    (data || []).forEach(function(salon) {

      const option = document.createElement("option");

      option.value = salon.id;

      option.textContent =
        salon.name ||
        salon.salon_name ||
        "Salon";

      salonSelect.appendChild(option);
    });
  }

  salonSelect.addEventListener("change", async function() {

    const salonId = salonSelect.value;

    serviceSelect.innerHTML =
      '<option value="">-- Odaberi uslugu --</option>';

    services = [];

    if (!salonId) {
      serviceSelect.disabled = true;
      return;
    }

    serviceSelect.disabled = true;

    const { data, error } = await supabaseClient
      .from("services")
      .select("*")
      .eq("salon_id", salonId)
      .order("category")
      .order("name");

    if (error) {
      console.error(error);
      message.style.color = "#ff7373";
      message.textContent = "Greška pri učitavanju usluga.";
      return;
    }

    services = data || [];

    services.forEach(function(service) {

      const option = document.createElement("option");

      option.value = service.id;

      let text = "";

      if (service.category) {
        text += service.category + " — ";
      }

      text += service.name || "Usluga";

      if (service.price !== null && service.price !== undefined) {
        text += " — " + service.price + " €";
      }

      if (service.duration_minutes) {
        text += " — " + service.duration_minutes + " min";
      }

      option.textContent = text;

      serviceSelect.appendChild(option);
    });

    serviceSelect.disabled = false;
  });

  bookButton.addEventListener("click", async function() {

    message.textContent = "";

    const salonId = salonSelect.value;
    const serviceId = serviceSelect.value;

    const customerName = nameInput.value.trim();
    const customerPhone = phoneInput.value.trim();
    const customerEmail = emailInput.value.trim();

    const bookingDate = dateInput.value;
    const bookingTime = timeInput.value;

    const note = noteInput.value.trim();

    if (
      !salonId ||
      !serviceId ||
      !customerName ||
      !customerPhone ||
      !customerEmail ||
      !bookingDate ||
      !bookingTime
    ) {
      message.style.color = "#ff7373";
      message.textContent =
        "Molimo popunite sva obavezna polja.";
      return;
    }

    if (!emailInput.checkValidity()) {
      message.style.color = "#ff7373";
      message.textContent =
        "Unesite ispravnu email adresu.";
      return;
    }

    bookButton.disabled = true;
    bookButton.textContent = "SPREMANJE...";

    /*
      Rezervacija se sprema u tabelu bookings.

      Potrebne kolone:
      salon_id
      service_id
      customer_name
      customer_phone
      customer_email
      booking_date
      booking_time
      note
    */

    const { error } = await supabaseClient
      .from("bookings")
      .insert({
        salon_id: salonId,
        service_id: serviceId,
        customer_name: customerName,
        customer_phone: customerPhone,
        customer_email: customerEmail,
        booking_date: bookingDate,
        booking_time: bookingTime,
        note: note || null
      });

    if (error) {

      console.error(error);

      message.style.color = "#ff7373";
      message.textContent =
        "Rezervacija trenutno nije spremljena. Provjerit ćemo bazu.";

      bookButton.disabled = false;
      bookButton.textContent = "REZERVIŠI TERMIN";

      return;
    }

    message.style.color = "#7ee787";
    message.textContent =
      "✅ Termin je uspješno rezervisan!";

    nameInput.value = "";
    phoneInput.value = "";
    emailInput.value = "";
    noteInput.value = "";
    dateInput.value = "";
    timeInput.value = "";

    bookButton.disabled = false;
    bookButton.textContent = "REZERVIŠI TERMIN";
  });

  loadSalons();
</script>

</body>
</html>
