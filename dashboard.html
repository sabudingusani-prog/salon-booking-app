<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TERMINO | Moj salon</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#0b0b0b;
color:#fff;
font-family:Arial,sans-serif;
padding:20px;
}

.wrap{
max-width:820px;
margin:20px auto;
}

.logo{
color:#d8ad55;
font-size:40px;
font-weight:900;
}

h1{
margin:6px 0 20px;
}

.card{
background:#151515;
border:1px solid #333;
border-radius:20px;
padding:20px;
margin:16px 0;
}

label{
display:block;
margin:12px 0 7px;
font-weight:700;
}

input,select{
width:100%;
padding:13px;
border-radius:10px;
border:1px solid #444;
background:#222;
color:#fff;
font-size:16px;
}

button{
border:0;
border-radius:11px;
padding:12px 14px;
font-weight:800;
cursor:pointer;
}

.gold{
background:#d8ad55;
color:#111;
margin-top:15px;
}

.gray{
background:#2a2a2a;
color:#fff;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:9px;
margin-top:14px;
}

.slot{
padding:13px 8px;
border-radius:11px;
text-align:center;
border:1px solid #444;
font-weight:800;
}

.available{
background:#163d24;
color:#8cffaa;
border-color:#2d7a45;
}

.unavailable{
background:#441d1d;
color:#ff9c9c;
border-color:#7e3333;
}

.service,.booking{
background:#222;
border:1px solid #333;
border-radius:12px;
padding:13px;
margin:9px 0;
}

.muted{
color:#aaa;
}

#availabilityMsg,
#serviceMsg,
#salonMsg{
margin-top:12px;
font-weight:700;
}

@media(max-width:620px){
.grid{
grid-template-columns:repeat(3,1fr);
}
}
</style>
</head>

<body>

<div class="wrap">

<div class="logo">TERMINO</div>
<h1>Moj salon</h1>

<div class="card">

<h2>🏪 Podaci salona</h2>

<label>Naziv</label>
<input id="salonName">

<label>Adresa</label>
<input id="salonAddress">

<label>Telefon</label>
<input id="salonPhone">

<button class="gold" onclick="saveSalon()">
SPREMI PODATKE
</button>

<div id="salonMsg"></div>

</div>


<div class="card">

<h2>🟢🔴 Moja dostupnost</h2>

<p class="muted">
Odaberi datum pa klikni vrijeme.
Zeleno = slobodan.
Crveno = nedostupan.
</p>

<label>Datum</label>
<input id="availabilityDate" type="date">

<div id="slots" class="grid"></div>

<div id="availabilityMsg"></div>

</div>


<div class="card">

<h2>✂️ Usluge</h2>

<label>Kategorija</label>

<select id="serviceCategory">

<option value="">-- Odaberi --</option>

<option>Muški frizer</option>
<option>Ženski frizer</option>
<option>Barber / Brada</option>
<option>Nokti</option>
<option>Manikir</option>
<option>Pedikir</option>
<option>Obrve i trepavice</option>
<option>Šminkanje</option>
<option>Depilacija</option>
<option>Masaža</option>
<option>Kozmetički tretmani</option>

</select>

<label>Naziv usluge</label>
<input id="serviceName">

<label>Cijena (€)</label>
<input id="servicePrice" type="number" step="0.01">

<label>Trajanje (min)</label>
<input id="serviceDuration" type="number">

<button class="gold" onclick="addService()">
DODAJ USLUGU
</button>

<div id="serviceMsg"></div>

<div id="services"></div>

</div>


<div class="card">

<h2>📅 Termini</h2>

<div id="bookings">

<div class="muted">
Učitavanje...
</div>

</div>

</div>


<button class="gray" onclick="logout()">
ODJAVI SE
</button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://ykkopljgzdcnfbyutxzo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_g0DyVw3GMFgrjZHwSeuvkQ_6x54CKue";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentSalon = null;

const $ =
id => document.getElementById(id);


async function user(){

const {
data:{user}
} =
await db.auth.getUser();

if(!user){

location.href =
"login.html";

return null;

}

return user;

}


async function logout(){

await db.auth.signOut();

location.href =
"login.html";

}


async function loadSalon(){

const u =
await user();

if(!u) return null;

const {
data,
error
} =
await db
.from("salons")
.select("*")
.eq("owner_id",u.id)
.maybeSingle();

if(error){

console.error(error);

return null;

}

currentSalon = data;

if(data){

$("salonName").value =
data.name || "";

$("salonAddress").value =
data.address || "";

$("salonPhone").value =
data.phone || "";

}

return data;

}


async function saveSalon(){

const u =
await user();

if(!u) return;

const name =
$("salonName").value.trim();

const address =
$("salonAddress").value.trim();

const phone =
$("salonPhone").value.trim();

if(!name){

$("salonMsg").textContent =
"Upiši naziv salona.";

return;

}

let error;

if(currentSalon){

({
error
} =
await db
.from("salons")
.update({
name,
address,
phone
})
.eq("id",currentSalon.id));

}

else{

({
error
} =
await db
.from("salons")
.insert({
owner_id:u.id,
name,
address,
phone
}));

}

if(error){

$("salonMsg").textContent =
"Greška: " + error.message;

return;

}

$("salonMsg").textContent =
"✅ Spremljeno.";

await loadSalon();

await loadServices();

await loadBookings();

await loadSlots();

}


const times = [];

for(
let h = 8;
h <= 20;
h++
){

for(
let m of [0,15,30,45]
){

if(
h === 20 &&
m > 0
)
continue;

times.push(
String(h).padStart(2,"0")
+
":"
+
String(m).padStart(2,"0")
);

}

}


async function loadSlots(){

if(!currentSalon)
return;

const date =
$("availabilityDate").value;

if(!date)
return;

const {
data,
error
} =
await db
.from("availability_slots")
.select("slot_time,is_available")
.eq(
"salon_id",
currentSalon.id
)
.eq(
"slot_date",
date
);

if(error){

$("availabilityMsg").textContent =
"Greška: " + error.message;

return;

}

const map = {};

(data || [])
.forEach(x => {

map[
String(x.slot_time)
.slice(0,5)
] =
x.is_available;

});


$("slots").innerHTML = "";


times.forEach(t => {

const b =
document.createElement("button");

const available =
map[t] === true;

b.className =
"slot "
+
(
available
?
"available"
:
"unavailable"
);

b.textContent = t;

b.onclick =
() =>
toggleSlot(
date,
t,
!available
);

$("slots")
.appendChild(b);

});

}


async function toggleSlot(
date,
time,
isAvailable
){

if(!currentSalon)
return;

const {
error
} =
await db
.from("availability_slots")
.upsert(
{
salon_id:
currentSalon.id,

slot_date:
date,

slot_time:
time,

is_available:
isAvailable
},
{
onConflict:
"salon_id,slot_date,slot_time"
}
);

if(error){

$("availabilityMsg").textContent =
"Greška: "
+
error.message;

return;

}

$("availabilityMsg").textContent =
isAvailable
?
"🟢 Označeno slobodno."
:
"🔴 Označeno nedostupno.";

await loadSlots();

}


$("availabilityDate")
.addEventListener(
"change",
loadSlots
);


async function addService(){

if(!currentSalon){

$("serviceMsg").textContent =
"Prvo spremi salon.";

return;

}

const category =
$("serviceCategory").value;

const name =
$("serviceName").value.trim();

const price =
Number(
$("servicePrice").value
);

const duration =
parseInt(
$("serviceDuration").value,
10
);


if(
!category ||
!name ||
!Number.isFinite(price) ||
!duration
){

$("serviceMsg").textContent =
"Popuni sva polja.";

return;

}


const {
error
} =
await db
.from("services")
.insert({

salon_id:
currentSalon.id,

category,

name,

price,

duration_minutes:
duration

});


if(error){

$("serviceMsg").textContent =
"Greška: "
+
error.message;

return;

}


$("serviceMsg").textContent =
"✅ Usluga dodana.";


$("serviceName").value = "";

$("servicePrice").value = "";

$("serviceDuration").value = "";


await loadServices();

}


async function loadServices(){

if(!currentSalon)
return;

const {
data,
error
} =
await db
.from("services")
.select("*")
.eq(
"salon_id",
currentSalon.id
)
.order("category")
.order("name");


if(error)
return;


$("services").innerHTML = "";


(data || [])
.forEach(s => {

const d =
document.createElement("div");

d.className =
"service";

d.innerHTML =
`
<b>
${s.category || "Ostalo"}
—
${s.name}
</b>

<br>

${s.price} €
·
${s.duration_minutes} min
`;

$("services")
.appendChild(d);

});

}


async function loadBookings(){

if(!currentSalon)
return;

const {
data,
error
} =
await db
.from("bookings")
.select(`
customer_name,
customer_phone,
customer_email,
booking_date,
booking_time,
status,
note,
services(
name,
category,
price
)
`)
.eq(
"salon_id",
currentSalon.id
)
.order("booking_date")
.order("booking_time");


if(error){

$("bookings").innerHTML =
"Greška: "
+
error.message;

return;

}


$("bookings").innerHTML = "";


if(!(data || []).length){

$("bookings").innerHTML =
'<div class="muted">Još nema rezervacija.</div>';

return;

}


data.forEach(b => {

const d =
document.createElement("div");

d.className =
"booking";

const s =
b.services || {};


d.innerHTML =
`
<b>
${b.booking_date}
·
${String(b.booking_time).slice(0,5)}
</b>

<br>

${s.category || ""}
${s.name || ""}

<br>

${b.customer_name}
·
${b.customer_phone}

<br>

${b.customer_email || ""}
`;


$("bookings")
.appendChild(d);

});

}


async function init(){

const d =
new Date();

$("availabilityDate").value =
d.toISOString().slice(0,10);

await loadSalon();

await loadSlots();

await loadServices();

await loadBookings();

}


init();

</script>

</body>
</html>
