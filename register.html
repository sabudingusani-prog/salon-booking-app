<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registracija salona | Termino</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #151515;
      border: 1px solid #333;
      border-radius: 22px;
      padding: 30px 24px;
    }

    .logo {
      color: #d8ad55;
      font-size: 34px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      margin: 10px 0;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #0d0d0d;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #d8ad55;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      line-height: 1.5;
    }

    a {
      color: #d8ad55;
    }

    .back {
      text-align: center;
      margin-top: 22px;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="logo">TERMINO</div>

    <h1>Registrujte svoj salon</h1>

    <div class="subtitle">
      Napravite račun i počnite primati online rezervacije.
    </div>

    <form id="registerForm">

      <label>Ime i prezime vlasnika</label>
      <input
        id="ownerName"
        type="text"
        placeholder="Vaše ime i prezime"
        required
      >

      <label>Naziv salona</label>
      <input
        id="salonName"
        type="text"
        placeholder="Naziv salona"
        required
      >

      <label>Email</label>
      <input
        id="email"
        type="email"
        placeholder="salon@email.com"
        required
      >

      <label>Lozinka</label>
      <input
        id="password"
        type="password"
        placeholder="Najmanje 6 znakova"
        minlength="6"
        required
      >

      <button type="submit">
        REGISTRUJ SALON
      </button>

    </form>

    <div id="message"></div>

    <div class="back">
      <a href="index.html">← Nazad na početnu</a>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://ykkopljgzdcnfbyutxzo.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_g0DyVw3GMFgrjZHwSeuvkQ_6x54CKue";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const form =
      document.getElementById("registerForm");

    const message =
      document.getElementById("message");


    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      message.textContent =
        "Kreiranje računa...";


      const ownerName =
        document.getElementById("ownerName").value.trim();

      const salonName =
        document.getElementById("salonName").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            emailRedirectTo:
              "https://sabudingusani-prog.github.io/salon-booking-app/register.html",

            data: {
              owner_name: ownerName,
              salon_name: salonName,
              account_type: "salon_owner"
            }

          }

        });


      if (error) {

        message.style.color = "#ff7373";

        message.textContent =
          "Greška: " + error.message;

        return;
      }


      message.style.color = "#7ee787";

      message.innerHTML =
        "✅ Registracija je uspješna.<br>" +
        "Provjerite email i potvrdite svoj račun.";

      form.reset();

    });
  </script>

</body>
</html>
